<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Filter & Search - Facebook Network Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 20px;
            padding: 2rem;
            margin: 1rem 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .gradient-text {
            background: linear-gradient(45deg, #f59e0b, #10b981, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .user-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 1rem;
            margin: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .user-card:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(59, 130, 246, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.2);
        }
        .filter-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            margin: 1rem 0;
        }
        .dark-input {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #e2e8f0;
            border-radius: 8px;
            padding: 0.75rem;
        }
        .dark-input::placeholder {
            color: rgba(226, 232, 240, 0.6);
        }
        .dark-button {
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .dark-button:hover {
            background: linear-gradient(45deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }
        .pagination-button {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #e2e8f0;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            margin: 0.25rem;
            transition: all 0.3s ease;
        }
        .pagination-button:hover {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.6);
        }
        .pagination-button.active {
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            border-color: rgba(59, 130, 246, 0.6);
        }
        .metric-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #10b981;
        }
        .metric-label {
            font-size: 0.875rem;
            color: rgba(226, 232, 240, 0.7);
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header Navigation -->
    <nav class="glass-card m-4">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold gradient-text">Facebook Network Analysis</h1>
            <div class="flex gap-4">
                <a href="/" class="dark-button">
                    <i class="fas fa-home mr-2"></i>Dashboard
                </a>
                <a href="/user-filter" class="dark-button">
                    <i class="fas fa-users mr-2"></i>User Filter
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto p-4">
        <!-- Page Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold gradient-text mb-4">User Filter & Search</h1>
            <p class="text-xl text-gray-300">Filter and browse all users with advanced sorting and pagination</p>
        </div>

        <!-- Filter Controls -->
        <div class="filter-card">
            <h2 class="text-2xl font-bold text-white mb-4">
                <i class="fas fa-filter text-blue-400 mr-2"></i>
                Filter & Sort Users
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-white mb-2">Sort By</label>
                    <select id="sort-by" class="dark-input w-full">
                        <option value="degree_desc">Highest Friends (Degree)</option>
                        <option value="degree_asc">Lowest Friends (Degree)</option>
                        <option value="betweenness_desc">Highest Betweenness</option>
                        <option value="betweenness_asc">Lowest Betweenness</option>
                        <option value="closeness_desc">Highest Closeness</option>
                        <option value="closeness_asc">Lowest Closeness</option>
                        <option value="eigenvector_desc">Highest Eigenvector</option>
                        <option value="eigenvector_asc">Lowest Eigenvector</option>
                    </select>
                </div>
                <div>
                    <label class="block text-white mb-2">Search User ID</label>
                    <input type="number" id="search-user-id" placeholder="Enter User ID" class="dark-input w-full">
                </div>
                <div>
                    <label class="block text-white mb-2">Results Per Page</label>
                    <select id="per-page" class="dark-input w-full">
                        <option value="50">50 users</option>
                        <option value="100" selected>100 users</option>
                        <option value="200">200 users</option>
                        <option value="500">500 users</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-4">
                <button id="apply-filters" class="dark-button">
                    <i class="fas fa-search mr-2"></i>Apply Filters
                </button>
                <button id="reset-filters" class="dark-button">
                    <i class="fas fa-refresh mr-2"></i>Reset
                </button>
            </div>
        </div>

        <!-- Results Summary -->
        <div class="filter-card">
            <div class="flex justify-between items-center">
                <div>
                    <h3 class="text-lg font-bold text-white">Results</h3>
                    <p id="results-summary" class="text-gray-300">Loading...</p>
                </div>
                <div class="flex gap-4">
                    <div class="text-center">
                        <div class="metric-value" id="total-users">-</div>
                        <div class="metric-label">Total Users</div>
                    </div>
                    <div class="text-center">
                        <div class="metric-value" id="current-page">-</div>
                        <div class="metric-label">Current Page</div>
                    </div>
                    <div class="text-center">
                        <div class="metric-value" id="total-pages">-</div>
                        <div class="metric-label">Total Pages</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="text-center py-8 hidden">
            <div class="loading-spinner mb-4"></div>
            <p class="text-white">Loading users...</p>
        </div>

        <!-- Users Grid -->
        <div id="users-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Users will be populated here -->
        </div>

        <!-- Pagination -->
        <div id="pagination" class="flex justify-center items-center mt-8">
            <!-- Pagination buttons will be populated here -->
        </div>

        <!-- User Profile Modal -->
        <div id="user-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden">
            <div class="glass-card max-w-4xl w-full mx-4 max-h-96 overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-2xl font-bold text-white">User Profile Analysis</h3>
                    <button id="close-modal" class="text-white text-2xl hover:text-gray-300">&times;</button>
                </div>
                <div id="user-profile-content" class="text-white">
                    <!-- User profile content will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let currentFilters = {
            sort_by: 'degree_desc',
            search_id: '',
            per_page: 100
        };

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
            setupEventListeners();
        });

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('apply-filters').addEventListener('click', function() {
                currentFilters = {
                    sort_by: document.getElementById('sort-by').value,
                    search_id: document.getElementById('search-user-id').value,
                    per_page: parseInt(document.getElementById('per-page').value)
                };
                currentPage = 1;
                loadUsers();
            });

            document.getElementById('reset-filters').addEventListener('click', function() {
                document.getElementById('sort-by').value = 'degree_desc';
                document.getElementById('search-user-id').value = '';
                document.getElementById('per-page').value = '100';
                currentFilters = {
                    sort_by: 'degree_desc',
                    search_id: '',
                    per_page: 100
                };
                currentPage = 1;
                loadUsers();
            });

            document.getElementById('close-modal').addEventListener('click', function() {
                document.getElementById('user-modal').classList.add('hidden');
            });
        }

        // Load users with current filters and page
        function loadUsers() {
            showLoading();
            
            const params = new URLSearchParams({
                page: currentPage,
                sort_by: currentFilters.sort_by,
                search_id: currentFilters.search_id,
                per_page: currentFilters.per_page
            });

            fetch(`/api/users/filter?${params}`)
                .then(response => response.json())
                .then(data => {
                    if (data && !data.error) {
                        populateUsers(data);
                        updatePagination(data);
                        updateSummary(data);
                    } else {
                        console.error('Error loading users:', data.error);
                        showError('Error loading users: ' + (data.error || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error fetching users:', error);
                    showError('Error fetching users: ' + error.message);
                })
                .finally(() => {
                    hideLoading();
                });
        }

        // Show loading state
        function showLoading() {
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('users-grid').innerHTML = '';
        }

        // Hide loading state
        function hideLoading() {
            document.getElementById('loading-state').classList.add('hidden');
        }

        // Show error message
        function showError(message) {
            document.getElementById('users-grid').innerHTML = `
                <div class="col-span-full text-center py-8">
                    <div class="text-red-400 text-lg">${message}</div>
                </div>
            `;
        }

        // Populate users grid
        function populateUsers(data) {
            const usersGrid = document.getElementById('users-grid');
            
            if (!data.users || data.users.length === 0) {
                usersGrid.innerHTML = `
                    <div class="col-span-full text-center py-8">
                        <div class="text-gray-400 text-lg">No users found</div>
                    </div>
                `;
                return;
            }

            usersGrid.innerHTML = data.users.map(user => `
                <div class="user-card" onclick="showUserProfile(${user.user_id})">
                    <div class="text-lg font-bold text-white">User ${user.user_id}</div>
                    <div class="text-sm text-gray-300 mt-2">
                        <div>Friends: ${user.degree_centrality ? user.degree_centrality.toFixed(3) : 'N/A'}</div>
                        <div>Betweenness: ${user.betweenness_centrality ? user.betweenness_centrality.toFixed(3) : 'N/A'}</div>
                        <div>Closeness: ${user.closeness_centrality ? user.closeness_centrality.toFixed(3) : 'N/A'}</div>
                        <div>Eigenvector: ${user.eigenvector_centrality ? user.eigenvector_centrality.toFixed(3) : 'N/A'}</div>
                    </div>
                    <div class="text-xs text-blue-400 mt-2">
                        <i class="fas fa-eye mr-1"></i>Click to view profile
                    </div>
                </div>
            `).join('');
        }

        // Update pagination
        function updatePagination(data) {
            const pagination = document.getElementById('pagination');
            const totalPages = data.total_pages || 1;
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let paginationHTML = '';
            
            // Previous button
            if (currentPage > 1) {
                paginationHTML += `
                    <button class="pagination-button" onclick="goToPage(${currentPage - 1})">
                        <i class="fas fa-chevron-left mr-1"></i>Previous
                    </button>
                `;
            }

            // Page numbers
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            if (startPage > 1) {
                paginationHTML += `<button class="pagination-button" onclick="goToPage(1)">1</button>`;
                if (startPage > 2) {
                    paginationHTML += `<span class="pagination-button">...</span>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                const activeClass = i === currentPage ? 'active' : '';
                paginationHTML += `
                    <button class="pagination-button ${activeClass}" onclick="goToPage(${i})">${i}</button>
                `;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationHTML += `<span class="pagination-button">...</span>`;
                }
                paginationHTML += `<button class="pagination-button" onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            // Next button
            if (currentPage < totalPages) {
                paginationHTML += `
                    <button class="pagination-button" onclick="goToPage(${currentPage + 1})">
                        Next<i class="fas fa-chevron-right ml-1"></i>
                    </button>
                `;
            }

            pagination.innerHTML = paginationHTML;
        }

        // Go to specific page
        function goToPage(page) {
            currentPage = page;
            loadUsers();
        }

        // Update summary
        function updateSummary(data) {
            document.getElementById('total-users').textContent = data.total_users || 0;
            document.getElementById('current-page').textContent = currentPage;
            document.getElementById('total-pages').textContent = data.total_pages || 1;
            
            const summary = `Showing ${data.users.length} users on page ${currentPage} of ${data.total_pages || 1}`;
            document.getElementById('results-summary').textContent = summary;
        }

        // Show user profile
        function showUserProfile(userId) {
            fetch(`/api/user/${userId}`)
                .then(response => response.json())
                .then(data => {
                    if (data && !data.error) {
                        displayUserProfile(data);
                    } else {
                        alert('User not found or error loading profile');
                    }
                })
                .catch(error => {
                    console.error('Error fetching user profile:', error);
                    alert('Error loading user profile');
                });
        }

        // Display user profile in modal
        function displayUserProfile(userData) {
            const modal = document.getElementById('user-modal');
            const content = document.getElementById('user-profile-content');
            
            if (content) {
                // Calculate additional metrics
                const degree = userData.centrality?.degree_centrality || 0;
                const betweenness = userData.centrality?.betweenness_centrality || 0;
                const closeness = userData.centrality?.closeness_centrality || 0;
                const eigenvector = userData.centrality?.eigenvector_centrality || 0;
                
                // Calculate combined influence score
                const combinedInfluence = ((degree + betweenness + closeness + eigenvector) / 4).toFixed(3);
                
                // Calculate friend clustering (approximate)
                const friendClustering = (degree * 0.3 + betweenness * 0.4 + eigenvector * 0.3).toFixed(3);
                
                // Get friend count
                const friendCount = userData.connections?.total || 0;
                
                // Get community info
                const communityId = userData.community?.community_id || 'N/A';
                const communitySize = userData.community?.community_size || 'N/A';
                
                content.innerHTML = `
                    <div class="space-y-6">
                        <!-- Header -->
                        <div class="text-center">
                            <h4 class="text-2xl font-bold gradient-text mb-2">User ${userData.user_id} - Complete Profile Analysis</h4>
                        </div>
                        
                        <!-- Basic Information -->
                        <div class="filter-card">
                            <h5 class="text-lg font-bold text-white mb-4">📊 Basic Information</h5>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="text-center">
                                    <div class="metric-value text-3xl">${friendCount}</div>
                                    <div class="metric-label">Total Friends/Connections</div>
                                    <div class="text-xs text-gray-400 mt-1">How many people this user is connected to</div>
                                </div>
                                <div class="text-center">
                                    <div class="metric-value text-2xl">Community ${communityId}</div>
                                    <div class="metric-label">Community Group</div>
                                    <div class="text-xs text-gray-400 mt-1">Which friend group this user belongs to</div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Influence Analysis -->
                        <div class="filter-card">
                            <h5 class="text-lg font-bold text-white mb-4">👑 Influence Analysis</h5>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="text-center">
                                    <div class="metric-value text-2xl">${degree.toFixed(4)}</div>
                                    <div class="metric-label">🔗 Connection Power</div>
                                    <div class="text-xs text-gray-400 mt-1">How well-connected this user is</div>
                                </div>
                                <div class="text-center">
                                    <div class="metric-value text-2xl">${betweenness.toFixed(4)}</div>
                                    <div class="metric-label">🌉 Bridge Role</div>
                                    <div class="text-xs text-gray-400 mt-1">How important this user is for connecting different groups</div>
                                </div>
                                <div class="text-center">
                                    <div class="metric-value text-2xl">${closeness.toFixed(4)}</div>
                                    <div class="metric-label">⚡ Speed of Influence</div>
                                    <div class="text-xs text-gray-400 mt-1">How quickly this user can reach others</div>
                                </div>
                                <div class="text-center">
                                    <div class="metric-value text-2xl">${eigenvector.toFixed(4)}</div>
                                    <div class="metric-label">🌟 Overall Influence</div>
                                    <div class="text-xs text-gray-400 mt-1">Combined influence score</div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Advanced Metrics -->
                        <div class="filter-card">
                            <h5 class="text-lg font-bold text-white mb-4">🔬 Advanced Network Metrics</h5>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="text-center">
                                    <div class="metric-value text-2xl">${combinedInfluence}</div>
                                    <div class="metric-label">🎯 Combined Influence Score</div>
                                    <div class="text-xs text-gray-400 mt-1">Overall network importance</div>
                                </div>
                                <div class="text-center">
                                    <div class="metric-value text-2xl">${friendClustering}</div>
                                    <div class="metric-label">🔗 Friend Clustering</div>
                                    <div class="text-xs text-gray-400 mt-1">How tightly connected this user's friends are</div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- What This Means -->
                        <div class="filter-card">
                            <h5 class="text-lg font-bold text-white mb-4">💡 What This Means</h5>
                            <div class="text-sm space-y-2">
                                <div class="flex items-start">
                                    <span class="text-blue-400 mr-2">•</span>
                                    <span>This user has <strong>${friendCount}</strong> friends - ${friendCount > 100 ? "that's a lot of connections!" : friendCount > 50 ? "that's a good number of connections" : "that's a moderate number of connections"}</span>
                                </div>
                                <div class="flex items-start">
                                    <span class="text-blue-400 mr-2">•</span>
                                    <span>They ${betweenness > 0.1 ? "act as a bridge between different friend groups" : "are more connected within their own group"}</span>
                                </div>
                                <div class="flex items-start">
                                    <span class="text-blue-400 mr-2">•</span>
                                    <span>They can ${closeness > 0.3 ? "quickly reach many other people" : "reach others at a moderate pace"} in the network</span>
                                </div>
                                <div class="flex items-start">
                                    <span class="text-blue-400 mr-2">•</span>
                                    <span>Their friends tend to ${eigenvector > 0.05 ? "know each other well" : "be loosely connected"}</span>
                                </div>
                                <div class="flex items-start">
                                    <span class="text-blue-400 mr-2">•</span>
                                    <span>They are in <strong>Community ${communityId}</strong> with ${communitySize !== 'N/A' ? `${communitySize} other similar users` : "other similar users"}</span>
                                </div>
                            </div>
                        </div>
                        
                        ${userData.features ? `
                        <!-- Personal Features -->
                        <div class="filter-card">
                            <h5 class="text-lg font-bold text-white mb-4">👤 Personal Profile</h5>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                ${userData.features.birthday ? `<div><strong>Birthday:</strong> ${userData.features.birthday}</div>` : ''}
                                ${userData.features.gender ? `<div><strong>Gender:</strong> ${userData.features.gender}</div>` : ''}
                                ${userData.features.hometown ? `<div><strong>Hometown:</strong> ${userData.features.hometown}</div>` : ''}
                                ${userData.features.location ? `<div><strong>Current Location:</strong> ${userData.features.location}</div>` : ''}
                                ${userData.features.education ? `<div><strong>Education:</strong> ${userData.features.education}</div>` : ''}
                                ${userData.features.work ? `<div><strong>Work:</strong> ${userData.features.work}</div>` : ''}
                                ${userData.features.languages ? `<div><strong>Languages:</strong> ${userData.features.languages}</div>` : ''}
                            </div>
                        </div>
                        ` : ''}
                        
                        ${userData.similar_users && userData.similar_users.length > 0 ? `
                        <!-- Similar Users -->
                        <div class="filter-card">
                            <h5 class="text-lg font-bold text-white mb-4">👥 Similar Users</h5>
                            <div class="text-sm">
                                ${userData.similar_users.map(user => 
                                    `<div class="mb-1">User ${user.user_id}: ${(user.similarity * 100).toFixed(1)}% similar</div>`
                                ).join('')}
                            </div>
                        </div>
                        ` : ''}
                        
                        <!-- Top Influencers in Network -->
                        <div class="filter-card">
                            <h5 class="text-lg font-bold text-white mb-4">🏆 Top Network Influencers</h5>
                            <div class="text-sm space-y-2">
                                <div class="flex justify-between">
                                    <span>Most Connected:</span>
                                    <span class="text-blue-400">User 107 (1045 friends)</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>Best Bridge:</span>
                                    <span class="text-green-400">User 107 (0.4805 betweenness)</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>Fastest Influence:</span>
                                    <span class="text-purple-400">User 107 (0.4597 closeness)</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>Most Prestigious:</span>
                                    <span class="text-yellow-400">User 1912 (0.0954 eigenvector)</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Network Statistics -->
                        <div class="filter-card">
                            <h5 class="text-lg font-bold text-white mb-4">📈 Network Statistics</h5>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                <div class="text-center">
                                    <div class="metric-value text-xl">4,039</div>
                                    <div class="metric-label">Total Users</div>
                                </div>
                                <div class="text-center">
                                    <div class="metric-value text-xl">88,234</div>
